<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Покупка</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding-top: 100px; }
        .container { max-width: 600px; margin: 0 auto; background: #2a2a2a; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #28a745; }
        .back-btn { display: inline-block; margin-top: 20px; text-decoration: none; color: white; background: #007bff; padding: 10px 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Поздравляем!</h1>
        <p>Вы оформили заявку на покупку <strong>{{ car[1] }} {{ car[2] }}</strong>.</p>
        <p>Наш менеджер свяжется с вами в ближайшее время, чтобы обсудить детали и цену в <strong>{{ "{:,}".format(car[8]) }} руб.</strong></p>
        <a href="/" class="back-btn">Вернуться на главную</a>
    </div>
</body>
</html>
