<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Покупка</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding-top: 100px; }
        .container { max-width: 600px; margin: 0 auto; background: #2a2a2a; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #28a745; }
        .btn-main { display: inline-block; margin-top: 20px; text-decoration: none; color: white; background: #ff4444; padding: 15px 30px; border-radius: 8px; font-weight: bold; font-size: 18px; margin-right: 10px;}
        .btn-main:hover { background: #cc0000; }
        .btn-back { display: inline-block; margin-top: 20px; text-decoration: none; color: white; background: #007bff; padding: 15px 30px; border-radius: 8px; font-size: 16px; }
        .btn-back:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Отличный выбор!</h1>
        <p>Вы выбрали <strong>{{ car[1] }} {{ car[2] }}</strong>.</p>
        <p>На нашем сайте это учебная модель, но вы можете посмотреть <strong>реальные объявления</strong> с такой машиной на крупнейшем авто-портале.</p>
        
        <!-- Кнопка на реальный сайт -->
        <a href="{{ drom_url }}" target="_blank" class="btn-main">Перейти к объявлениям на Дроме</a>
        
        <!-- Кнопка назад -->
        <br>
        <a href="/" class="btn-back">← Вернуться на главную</a>
    </div>
</body>
</html>
